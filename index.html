<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天文星座星象知识站</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="logo">🌌 星之彼岸</span>
        <h1 class="site-title">天文星座星象知识站</h1>
      </div>
      <div class="header-actions">
        <input type="search" id="searchInput" class="search-box" placeholder="搜索星座、行星、梅西耶编号、流星雨...">
        <button id="themeToggle" class="theme-btn" title="切换明暗主题">🌙</button>
      </div>
    </div>
    <nav class="category-nav container">
      <div class="cat-scroll">
        <button class="cat-btn active" data-cat="全部">全部</button><button class="cat-btn " data-cat="黄道12宫">黄道12宫</button><button class="cat-btn " data-cat="深空天体">深空天体</button><button class="cat-btn " data-cat="太阳系行星">太阳系行星</button><button class="cat-btn " data-cat="流星雨观测">流星雨观测</button><button class="cat-btn " data-cat="天文器材">天文器材</button><button class="cat-btn " data-cat="恒星知识">恒星知识</button>
      </div>
      <div class="header-stats" id="headerStats">共 <b id="totalCount">0</b> 条 · 最后更新 <span id="lastUpdate">-</span></div>
    </nav>
  </header>

  <main class="container main-area">
    <section id="cardGrid" class="card-grid">
      <!-- 动态渲染 -->
    </section>
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">没有找到相关内容</div>
      <div class="empty-desc">试试换个关键词或切换其他分类</div>
    </div>
  </main>

  <!-- 详情弹窗 -->
  <div id="detailModal" class="modal" style="display:none">
    <div class="modal-mask" onclick="closeModal()"></div>
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
<script src="./js/app.js"></script>
</body>
</html>
